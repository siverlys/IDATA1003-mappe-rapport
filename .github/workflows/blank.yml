name: Render paper.pdf
on: push
jobs:
  render-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: typst-community/setup-typst@v5
      # 🎉 Now Typst is installed!
      - run: typst compile main.typ rapport.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: rapport.pdf
